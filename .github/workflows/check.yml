name: Pathora checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pathora_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: pathora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pathora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://pathora_test:test_only_password@127.0.0.1:5432/pathora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
