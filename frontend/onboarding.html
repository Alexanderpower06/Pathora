<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Pathora — Build your path</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/onboarding.css" />
    <script type="module" src="/onboarding.js"></script>
  </head>
  <body class="onboarding-body">
    <a class="skip-link" href="#onboarding-content">Skip to setup</a>
    <header class="onboarding-header">
      <a class="brand" href="/" aria-label="Pathora home"
        ><span class="brand-mark">p</span>pathora<span class="brand-dot">.</span></a
      ><button id="onboarding-signout" class="text-button">Sign out</button>
    </header>
    <main class="onboarding-shell" id="onboarding-content" tabindex="-1">
      <div class="setup-progress">
        <div>
          <span id="step-label">Your next chapter</span
          ><span id="save-status" role="status">Connecting…</span>
        </div>
        <ol id="step-progress" aria-label="Onboarding progress"></ol>
      </div>
      <div id="onboarding-view"><p>Loading your saved starting point…</p></div>
    </main>
    <footer class="setup-footer">
      Small steps. Real momentum.<span>Your answers shape a plan you can change.</span>
    </footer>
  </body>
</html>
